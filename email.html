<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation of your registration - F.U.S.T. Tilburg</title>
    <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
}

:root {
  --color-pink: #C67DFF;
  --color-pink-light: #cd8ffd;
  --color-purple: #7958B3;
  --color-purple-light: #9474cc;
  --color-yellow: #FFBD59;
  --text-color-dark: #1E1E1E;
  --text-color-body: rgba(30, 30, 30, 0.8);
  --font-family-header: "League Spartan", sans-serif;
  --padding-body-horizontal: 64px;
}

h1,
h2,
h3,
h4 {
  font-family: "League Spartan", sans-serif;
  font-weight: 700;
  margin: 0;
}

p {
  line-height: 1.4;
}

body {
  margin: 0;
  padding: 0;
  font-family: "Lato", sans-serif;
  color: var(--text-color-dark);
}

a.link {
  color: var(--color-purple);
  text-decoration: none;
}
a.link.white {
  color: white;
}
a.link.no-color {
  color: inherit;
  transition: color 100ms ease;
}
a.link.no-color:hover {
  color: var(--color-purple);
}
section {
  position: relative;
  padding: 4rem var(--padding-body-horizontal);
}
section:nth-child(odd):not(:first-child) {
  background-color: #f8f9fa;
}

section.centered {
  text-align: center;
}

section .section-content {
  max-width: 1300px;
  width: 100%;
  margin: 0 auto;
}

section h1.section-title {
  margin-bottom: 0.6em;
}

.section-container {
  margin: 48px auto;
}

.section-divider {
  border-bottom: 1px solid var(--color-pink-light);
  margin: 2rem auto;
  width: 100%;
}
    </style>
</head>
<body>
    <section>
        <div class="section-content">
            <h1>Hi!</h1>
        </div>
    </section>
</body>
</html>
